{% load static %}
<link rel="preload" href="{% static 'core/fonts/manrope-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
<script>
    try {
        const savedTheme = window.localStorage.getItem("erp-vity-adv-theme");
        if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
        }
        // Menu recolhido (só ícones): aplicado antes de desenhar a página, sem "piscar".
        if (window.localStorage.getItem("erp-vity-adv-sidebar-rail") === "true") {
            document.documentElement.classList.add("menu-rail");
        }
    } catch (error) {}
</script>
