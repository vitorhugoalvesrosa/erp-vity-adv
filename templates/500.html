<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erro no sistema</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f7f7; color: #14262b; }
  main { max-width: 440px; padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgb(13 59 69 / 10%); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 20px; line-height: 1.5; color: #546a70; }
  a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #0b7a83; color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #0b0d12; color: #e8eaef; } main { background: #12151c; } p { color: #8b93a5; } }
</style>
</head>
<body>
<main>
  <h1>Algo deu errado</h1>
  <p>O sistema encontrou um erro inesperado e o registro ficou no log. Volte e tente de novo; se continuar, avise o suporte informando o que estava fazendo.</p>
  <a href="/">Voltar ao início</a>
</main>
</body>
</html>
